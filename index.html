<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body>

    <!-- Portada superior con banner Planificador de Tareas -->
    <div class="notion-cover">
        <img src="img/planer2.jpg?v=2" alt="Planificador de Tareas" class="cover-img">
    </div>

    <!-- Contenedor estilo pagina de Notion -->
    <main class="container notion-page pb-5">

        <!-- Icono circular flotante + Linea divisoria -->
        <header class="notion-header mb-4">
            <div class="notion-icon-badge">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v2" />
                    <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                    <path d="m7 11 1.5 1.5L11 10" />
                    <path d="m7 16 1.5 1.5L11 15" />
                    <line x1="13" y1="16" x2="16" y2="16" />
                    <circle cx="18" cy="11" r="3.5" fill="#7c689c" stroke="#ffffff" stroke-width="1.6" />
                    <path d="M18 9.5v1.6l1.1.7" />
                </svg>
            </div>
        </header>

        <!-- Layout de 2 columnas estilo Notion -->
        <div class="row g-4 pt-1">

            <!-- Columna izquierda: Navegacion y Formulario -->
            <aside class="col-lg-4">

                <!-- Bloque Navegacion -->
                <div class="mb-4">
                    <h2 class="notion-section-heading">Navegación</h2>
                    <div class="notion-callout-box p-3">
                        <div class="d-flex align-items-center gap-2 mb-2 px-1 text-dark fw-semibold small">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#554b66"
                                stroke-width="2">
                                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                            </svg>
                            <span>Estados</span>
                        </div>
                        <nav class="nav flex-column nav-pills-lila gap-1">
                            <a class="nav-link active d-flex justify-content-between align-items-center" href="#">
                                <span class="nav-item-text">Todas</span>
                                <span id="count-all" class="badge bg-white text-lila">5</span>
                            </a>
                            <a class="nav-link d-flex justify-content-between align-items-center" href="#">
                                <span class="nav-item-text">Pendientes</span>
                                <span id="count-pending" class="badge badge-count">4</span>
                            </a>
                            <a class="nav-link d-flex justify-content-between align-items-center" href="#">
                                <span class="nav-item-text">Completadas</span>
                                <span id="count-completed" class="badge badge-count">1</span>
                            </a>
                        </nav>
                    </div>
                </div>

                <!-- Bloque Acciones Rapidas / Nueva Tarea -->
                <div>
                    <h3 class="notion-section-heading">Acciones Rápidas · Nueva Tarea</h3>
                    <div class="notion-callout-box p-3">

                        <div id="form-alert" class="alert alert-danger small py-2 px-3 d-none" role="alert">
                        </div>

                        <form id="task-form" novalidate>

                            <div class="mb-3">
                                <label for="task-title" class="form-label">Título de la tarea</label>
                                <input type="text" class="form-control" id="task-title"
                                    placeholder="Ej. Terminar laboratorio">
                            </div>

                            <div class="mb-3">
                                <label for="task-desc" class="form-label">Descripción</label>
                                <textarea class="form-control" id="task-desc" rows="2"
                                    placeholder="Detalles de la tarea..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="task-date" class="form-label">Fecha de entrega</label>
                                <input type="date" class="form-control" id="task-date">
                            </div>

                            <div class="mb-3" id="task-priority-group">
                                <label class="form-label d-block mb-1">Prioridad</label>
                                <div class="d-flex gap-3 flex-wrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="priority" id="alta"
                                            value="Alta">
                                        <label class="form-check-label badge prioridad-alta" for="alta">Alta</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="priority" id="media"
                                            value="Media">
                                        <label class="form-check-label badge prioridad-media" for="media">Media</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="priority" id="baja"
                                            value="Baja">
                                        <label class="form-check-label badge prioridad-baja" for="baja">Baja</label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-lila w-100 py-2">+ Nueva Tarea</button>
                        </form>
                    </div>
                </div>

            </aside>

            <!-- Columna derecha: Tareas de la Semana / Lista de Tareas -->
            <section class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center notion-section-heading">
                    <span>Tareas de la Semana</span>
                    <span id="total-tasks-badge" class="badge-counter">5 tareas registradas</span>
                </div>

                <!-- Sub-barra tipo vista de Notion -->
                <div class="d-flex justify-content-between align-items-center py-2 mb-3 notion-subbar">
                    <div class="d-flex align-items-center gap-2 text-muted small fw-medium">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span>Vista de Tarjetas</span>
                    </div>
                    <span class="text-muted small">Noviembre 2026</span>
                </div>

                <!-- Contenedor de tarjetas -->
                <div id="tasks-container" class="d-flex flex-column gap-2">
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/taskManager.js?v=2"></script>
    <script src="js/index.js?v=2"></script>
</body>

</html>
